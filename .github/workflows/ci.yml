name: Foundry CI

on:
  push:
    branches: ["main", "feature/phase-2-sepolia-preflight"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Install dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-commit
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable@v5.0.2 --no-commit
          forge install foundry-rs/forge-std@v1.9.6 --no-commit

      - name: Check formatting
        run: forge fmt --check

      - name: Lint
        run: forge lint --deny warnings

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      - name: Coverage summary
        run: forge coverage --report summary

      - name: Inspect VaultCoin ABI
        run: forge inspect VaultCoin abi

      - name: Simulate deployment locally
        run: forge script script/DeployVaultCoin.s.sol:DeployVaultCoin -vvvv
